<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>페이지를 찾을 수 없음 · Practical Agentic AI</title>
  <style>
    :root { color-scheme: light dark; font-family: Inter, Pretendard, ui-sans-serif, system-ui, sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f4f6f2; color: #172018; }
    main { width: min(520px, calc(100% - 40px)); }
    p { color: #647067; line-height: 1.7; }
    a { color: inherit; font-weight: 700; text-underline-offset: 4px; }
    .code { color: #347a4a; font-size: .78rem; font-weight: 800; letter-spacing: .14em; }
    @media (prefers-color-scheme: dark) { body { background: #141814; color: #edf2ed; } p { color: #abb5ad; } }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>페이지를 찾을 수 없습니다</h1>
    <p>요청한 주소에 페이지가 없습니다. 주소를 확인하거나 학습 포털로 돌아가세요.</p>
    <a href="/">학습 포털로 돌아가기</a>
  </main>
</body>
</html>
